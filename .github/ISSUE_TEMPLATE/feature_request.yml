name: Feature request
description: Suggest an idea or improvement for DEVtoy-support.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing your idea. The more detail you give, the better.
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and didn't find a similar request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need or frustration.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like DEVtoy-support to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Any other approaches or workarounds you've thought about.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Mockups, examples from other apps, or anything else that helps.
    validations:
      required: false
